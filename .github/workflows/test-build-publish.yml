# This workflow will run unit and static test, build and upload
# a Python Package to PyPI
---
name: test-build-publish

on: [push, pull_request]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - '3.13'
          - '3.14'
          - '3.15'
          - '3.16-dev'
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          uv sync
      - name: Test with pytest
        run: |
          uv run pytest tests --cov=tests --cov=pc_init --cov-report=xml
      - name: "Upload coverage to Codecov"
        if: ${{ matrix.python-version == '3.13' }}
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: true
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

  static-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"
      - name: Install dependencies
        run: |
          uv sync --all-extras
      - name: Typecheck
        run: |
          uv run pyrefly check pc_init tests
          uv run ty check pc_init tests
          uv run zuban check pc_init tests
      - name: Linting
        run: |
          uv run ruff check --no-fix pc_init tests
          uv run ruff format --check pc_init tests
          uv run ryl .github/workflows/
      - name: Validate prek TOML output
        run: |
          uv run python main.py --lang py,js --format toml --output "$RUNNER_TEMP/prek.toml"
          uv run prek validate-config "$RUNNER_TEMP/prek.toml"
      - name: Check release prerequisites are up to date
        if: >-
          github.base_ref == 'main' ||
          startsWith(github.ref, 'refs/tags/')
        run: |
          uv run prek autoupdate --check
          find lang framework -name "preset*.yaml" |
            xargs -I{} uv run prek autoupdate --check -c {}
          ! uv lock --upgrade --dry-run 2>&1 | grep -E '^(Update|Add|Remove) '
      - name: Check complexity
        run: |
          uv run radon cc --min B pc_init
          uv run radon mi --min B pc_init
          uv run lizard -l python -w pc_init
          uv run complexipy pc_init

  build-and-check-package:
    name: Build & inspect our package.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - uses: hynek/build-and-inspect-python-package@v2
      - uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"
      - name: Check with pyroma
        run: |
          uv tool run pyroma .
      - name: Check tag name
        if: >-
          github.event_name == 'push' &&
          startsWith(github.ref, 'refs/tags')
        run: |
          uv tool run vercheck $GITHUB_REF_NAME --toml


  test-publish:
    if: >-
        github.event_name == 'push' &&
        github.repository == 'cleder/gpc-init' &&
        startsWith(github.ref, 'refs/tags')
    needs: [build-and-check-package, unit-tests, static-tests]
    name: Test install on TestPyPI
    runs-on: ubuntu-latest
    environment: test-release
    permissions:
      id-token: write
    steps:
      - name: Download packages built by build-and-check-package
        uses: actions/download-artifact@v4
        with:
          name: Packages
          path: dist

      - name: Upload package to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'cleder/gpc-init' &&
      github.ref == 'refs/heads/main'
    needs: [build-and-check-package, unit-tests, static-tests]
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Download packages built by build-and-check-package
        uses: actions/download-artifact@v4
        with:
          name: Packages
          path: dist

      - name: Publish distribution 📦 to PyPI for push to main
        uses: pypa/gh-action-pypi-publish@release/v1
...
