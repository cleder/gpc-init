---
repos:
  - repo: https://github.com/sphinx-contrib/sphinx-lint
    rev: "v1.0.2"
    hooks:
      - id: sphinx-lint
  - repo: https://github.com/rstcheck/rstcheck
    rev: v6.2.5
    hooks:
      - id: rstcheck
  - repo: https://github.com/dzhu/rstfmt
    rev: v0.0.14
    hooks:
      - id: rstfmt
