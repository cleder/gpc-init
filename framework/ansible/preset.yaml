---
recommended:
  lang:
    - yaml
repos:
  - repo: https://github.com/ansible/ansible-lint
    rev: v26.11.0
    hooks:
      - id: ansible-lint
        description: "This hook runs ansible-lint."

  - repo: https://github.com/arhuman/ansible-static-lint
    rev: v0.7.2
    hooks:
      - id: astl
        description: "Static Ansible linting, no Ansible runtime required."
