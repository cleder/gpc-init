[files]
yaml = [
    "*.yaml",
    "*.yml",
    ".yamllint",
]

[lint.rules]
anchors = "enable"
braces = "enable"
brackets = "enable"
colons = "enable"
document-end = "disable"
empty-lines = "enable"
empty-values = "disable"
float-values = "disable"
hyphens = "enable"
indentation = "enable"
key-duplicates = "enable"
key-ordering = "disable"
line-length = "disable"
new-line-at-end-of-file = "enable"
new-lines = "enable"
octal-values = "disable"
quoted-strings = "disable"
trailing-spaces = "enable"

[lint.rules.commas]
level = "error"
max-spaces-before = 0
min-spaces-after = 0
max-spaces-after = 1

[lint.rules.comments]
level = "warning"
min-spaces-from-content = 1

[lint.rules.comments-indentation]
level = "warning"

[lint.rules.document-start]
level = "warning"

[lint.rules.truthy]
level = "warning"

# Keep `ryl format` compatible with yamlfmt (the legacy YAML formatter in the
# yaml preset): leave quoting alone, use a single space before inline comments
# and collapse runs of blank lines.
[format]
quote-style = "preserve"
comment-spacing = 1
max-blank-lines = 1
