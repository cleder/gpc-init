---
repos:
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.3.0
    hooks:
      - id: sqlfluff-fix
        args: [--dialect, ansi]
        description: "Fixes sql lint errors with `SQLFluff`"
      - id: sqlfluff-lint
        args: [--dialect, ansi]
        description: "Lints sql files with `SQLFluff`"
  - repo: https://github.com/sbdchd/squawk
    rev: v2.65.0
    hooks:
      - id: squawk
        files: path/to/postgres/migrations/written/in/sql
        description: 'Linter for Postgres migrations'
  - repo: https://github.com/tconbeer/sqlfmt
    rev: v0.27.0
    hooks:
      - id: sqlfmt
        language_version: python
        additional_dependencies: ['.[jinjafmt]']
        description: "Formats sql files with `sqlfmt`"
