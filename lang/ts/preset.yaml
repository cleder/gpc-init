---
repos:
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.3
    hooks:
      - id: biome-check
        additional_dependencies: ["@biomejs/biome@1.9.4"]
        description: "Biome's pre-commit hooks."
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.6.0
    hooks:
      - id: eslint
        files: \.[jt]sx?$
        types: [file]
        additional_dependencies:
          - eslint@9.23.0
          - "@typescript-eslint/parser@8.0.0"
          - "@typescript-eslint/eslint-plugin@8.0.0"
        description: "Mirror of eslint node package for pre-commit."
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [ts, tsx, javascript, jsx, json, css, markdown]
        description: "mirror of the `prettier` npm package for pre-commit"
