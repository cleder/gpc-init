---
repos:
  - repo: https://github.com/pocc/pre-commit-hooks
    rev: v1.3.5
    hooks:
      - id: clang-format
        description: "Formats C, C++, Objective-C, and Java code"
      - id: cppcheck
        description: "Find warnings/errors in C, C++, and Objective-C code"
      - id: clang-tidy
        description: "Find warnings/errors in C, C++, and Objective-C code"
      - id: cpplint
        description: "Find warnings/errors in C/CPP code"
      - id: include-what-you-use
        description: "Runs Include-What-You-Use (iwyu) in C/CPP code"
  - repo: https://github.com/cpp-linter/cpp-linter-hooks
    rev: v1.6.0  # Use the tag or commit you want
    hooks:
      - id: clang-format
        args: [--style=Google]  # Other coding style: LLVM, GNU, Chromium, Microsoft, Mozilla, WebKit.
        description: Automatically install any specific version of clang-format and format C/C++ code
      - id: clang-tidy
        args: [--checks='boost-*,bugprone-*,performance-*,readability-*,portability-*,modernize-*,clang-analyzer-*,cppcoreguidelines-*']
        description: Automatically install any specific version of clang-tidy and diagnose/fix typical programming errors
