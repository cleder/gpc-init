---
repos:
  - repo: https://github.com/MarcoGorelli/absolufy-imports
    rev: v0.3.1
    hooks:
      - id: absolufy-imports
        description: "Automatically convert relative imports to absolute"
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        description: "Run 'ruff check' for extremely fast Python linting"
      - id: ruff-format
        description: "Run 'ruff format' for extremely fast Python formatting"
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject
        additional_dependencies: ["validate-pyproject-schema-store[all]"]
        description: "Validation library for a simple check on pyproject.toml, including optional dependencies"
  - repo: https://github.com/kieran-ryan/pyprojectsort
    rev: v0.4.0
    hooks:
      - id: pyprojectsort
        description: "`pyprojectsort` is a formatter for pyproject.toml files"
  - repo: https://github.com/adamchainz/blacken-docs
    rev: 1.20.0
    hooks:
      - id: blacken-docs
        description: "Run `black` on python code blocks in documentation files"
  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: 1.2.0.dev3
    hooks:
      - id: pyrefly-check
        description: "Run `pyrefly check` for Python type checking."
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.65
    hooks:
      - id: ty
        description: "Run 'ty' for extremely fast Python type checking"
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        category: legacy
        description: "Mirror of mypy for pre-commit"
  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.411
    hooks:
      - id: pyright
        category: experimental
        description: "Run 'pyright' for Python type checking (Microsoft)"
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        category: legacy
        description: "Style guide enforcement (superseded by ruff-check)"
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        category: legacy
        description: "Sort Python imports (superseded by ruff-check's import-sorting rules)"
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black
        category: legacy
        language_version: python3
        description: "The uncompromising Python code formatter (superseded by ruff-format)"
  - repo: https://github.com/rohaquinlop/complexipy-pre-commit
    rev: v6.2.0
    hooks:
      - id: complexipy
        description: "Run 'complexipy' for extremely fast calculation of cognitive complexity of Python files"
  - repo: https://github.com/asmeurer/removestar
    rev: 1.5.2
    hooks:
      - id: removestar
        args: [-i]
        description: "Automatically replace `import *` imports in Python files with explicit imports"
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-ll"]
        files: \.py$
        description: "Bandit is a tool for finding common security issues in Python code"
  - repo: https://github.com/PyCQA/docformatter
    rev: v1.7.8
    hooks:
      - id: docformatter
        args: [--in-place]
        description: "Formats docstrings to follow PEP 257."
  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        args: ["--quiet", "--fail-under=70"]
        description: "interrogate your code base for missing docstrings"
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py313-plus]
        description: "Automatically upgrade syntax for newer versions."
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.0
    hooks:
      - id: uv-lock
        description: "Automatically run 'uv lock' on your project dependencies"
      - id: uv-sync
        description: "Automatically run 'uv sync' on your repository after a checkout, pull or rebase"
      - id: uv-audit
        files: ^(uv\.lock|pyproject\.toml)$
        description: "Automatically run 'uv audit' on your project dependencies"
      - id: uv-export
        description: "Automatically run 'uv export' on your project dependencies"
  - repo: https://github.com/numpy/numpydoc
    rev: v1.11.0rc0
    hooks:
      - id: numpydoc-validation
        exclude: "tests/"
        description: "This hook validates that docstrings in committed files adhere to numpydoc standards."
  - repo: https://github.com/osprey-oss/deptry.git
    rev: "0.25.1"
    hooks:
      - id: deptry
        description: "deptry is a command line tool to check for issues with dependencies in a Python project, such as unused or missing dependencies."
  - repo: https://github.com/shelkesays/safelint
    rev: v2.10.0  # replace with the latest release tag (Java requires v2.1.0+, Rust requires v2.2.0+)
    hooks:
      - id: safelint
        # Required in v2.0.0+, pick the line for the language(s) your repo lints:
        additional_dependencies: ['safelint[python]']               # Python-only repo
        # additional_dependencies: ['safelint[javascript]']         # JS-only repo (Node / browser / Deno / Cloudflare Workers / Bun)
        # additional_dependencies: ['safelint[typescript]']         # TypeScript repo (bundles tree-sitter-javascript too)
        # additional_dependencies: ['safelint[java]']               # Java repo (Spring Boot via [tool.safelint.java] framework = "spring-boot")
        # additional_dependencies: ['safelint[rust]']               # Rust repo
        # additional_dependencies: ['safelint[php]']                # PHP repo
        # additional_dependencies: ['safelint[python,javascript]']  # mixed monorepo
        # additional_dependencies: ['safelint[python,rust]']        # Python + Rust (e.g. PyO3 / maturin projects)
        # additional_dependencies: ['safelint[all]']                # kitchen-sink

        args: [--fail-on=error]   # or --fail-on=warning for stricter CI
        files: ^src/              # optional, scope to a directory
        description: >
          Checks source files against safety-critical coding rules inspired by
          Gerard J. Holzmann's Power of Ten (NASA/JPL). Catches oversized functions,
          deep nesting, bare excepts, global mutation, unbounded loops, and more.
          Every supported language ships as an opt-in extra in v2.0.0+ - pick the
          matching one via ``additional_dependencies`` in your
          ``.pre-commit-config.yaml``: ``['safelint[python]']``,
          ``['safelint[javascript]']``, ``['safelint[typescript]']``,
          ``['safelint[java]']``, ``['safelint[rust]']``, ``['safelint[go]']``,
          ``['safelint[php]']``, ``['safelint[c]']``, ``['safelint[cpp]']``, or
          ``['safelint[all]']``. Without an extra, the hook installs only the
          engine and exits with a clear install hint on first run.
