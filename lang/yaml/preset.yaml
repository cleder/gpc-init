---
repos:
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
        description: "This hook uses github.com/google/yamlfmt to format yaml files. Requires Go >1.18 to be installed."
  - repo: https://github.com/owenlamont/ryl-pre-commit
    # Match the latest ryl release tag.
    rev: v0.21.0
    hooks:
      - id: ryl
        description: "Lint YAML files with the ryl CLI"
      - id: ryl-markdown
        description: "Lint YAML embedded in Markdown (front matter + fenced yaml blocks)"
