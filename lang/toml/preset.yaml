---
repos:
  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
        description: "Format TOML documents"
      - id: taplo-lint
        description: "Lint TOML documents"
  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: v1.5.5
    hooks:
      - id: tombi-format
        args: ["--offline"]
        description: "A TOML formatter"
      - id: tombi-lint
        args: ["--offline"]
        description: "A TOML linter"
  - repo: https://github.com/AndrewDongminYoo/toml-tidy
    rev: v0.6.0
    hooks:
      - id: toml-tidy
        description: Sort TOML keys while preserving table hierarchy, comments, and formatting.
        args: [--blank-lines, --order, alpha]
        exclude: ^uv\.lock$ # lockfiles are TOML too
