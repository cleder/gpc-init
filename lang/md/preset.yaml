---
repos:
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.45
    hooks:
      - id: rumdl-fmt
        description: "Format Markdown files in place. Always exits 0; relies on pre-commit file-change detection."
      - id: rumdl
        description: "Lint Markdown files. Exits 1 if violations are found. Add args [--fix] to auto-fix in place."
  - repo: https://github.com/thlorenz/doctoc
    rev: v2.5.0
    hooks:
      - id: doctoc
        description: "📜 Generates table of contents for markdown files inside local git repository. Links are compatible with anchors generated by github or other sites."
  - repo: https://github.com/amperser/proselint
    rev: v0.16.0
    hooks:
      - id: proselint
        description: "This hook checks language usage and style in text files."
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        args: []
        description: "Checks the style of Markdown/CommonMark files."
