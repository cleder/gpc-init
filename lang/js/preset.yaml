---
repos:
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.1
    hooks:
      - id: biome-check
        additional_dependencies: ["@biomejs/biome@1.9.4"]
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [javascript, jsx, json, css, markdown]
  - repo: https://github.com/oxc-project/mirrors-oxlint
    rev: v0.0.0
    hooks:
      - id: oxlint
        verbose: true
        description: "oxlint is a linter for JavaScript and TypeScript codebases. It helps identify and fix common issues, enforce coding standards, and improve code quality."
